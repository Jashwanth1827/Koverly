[project]
name = "koverly-backend"
version = "0.1.0"
description = "Koverly — Insurance Operating System for families (backend API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.8.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.4.0",
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "pypdf>=4.3.0",
    "numpy>=1.26.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "striprtf>=0.0.26",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
]
s3 = [
    "boto3>=1.34.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so CI and every contributor's local run agree. Scoped to
# genuinely useful checks: pyflakes, import order, bugbear, comprehension and
# datetime hygiene, ruff-specific rules, pyupgrade, refurb, string-concat and
# blind-except. Line length is deliberately NOT enforced (E501) because the
# extraction patterns are long, single-line regexes.
select = [
    "E4", "E7", "E9", # error subset that is style-agnostic
    "F",   # pyflakes
    "I",   # import order
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "PIE", # flake8-pie
    "RUF", # ruff-specific
    "UP",  # pyupgrade
    "FURB", # refurb
    "ISC", # flake8-implicit-str-concat
    "BLE", # flake8-blind-except
]
ignore = [
    "ISC001",  # conflicts with the formatter; ISC004 covers the risky cases
    "DTZ011",  # date.today() is intentional: due dates/expiry are calendar-day
    # semantics for the user, not UTC instants.
    "UP042",   # (str, Enum) kept: switching to StrEnum changes str(member)
    # output and would ripple through serialisation for no functional gain.
]

[tool.ruff.lint.per-file-ignores]
# conftest deliberately configures the environment (test DB/storage/secrets)
# before importing the application; imports below the env block are the design.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are callables used as parameter defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.uv]
package = false
