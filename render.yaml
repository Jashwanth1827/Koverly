# Koverly on Render — Infrastructure as Code.
#
# One-click: Render Dashboard → New → Blueprint → select this repo.
# Render reads this file, creates the web service, and generates a SECRET_KEY.
#
# The database is deliberately NOT provisioned here. DATABASE_URL points at an
# external Postgres — Supabase is the recommended option (free tier, IPv4
# pooler, TLS). Enter it once in the Render dashboard: the `sync: false` below
# tells Render to keep the value you set instead of clearing it on syncs.
#
# The web service builds the combined image (deploy/render/Dockerfile): nginx
# serves the SPA and proxies /api to the FastAPI app on the same origin.

services:
  - type: web
    name: koverly
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    # Durable document storage. Render disks require a paid instance type, so
    # this is off by default to keep the free-plan deploy one-click. To persist
    # uploaded documents across deploys, set `plan: starter` (or higher) above,
    # uncomment the block below, and confirm STORAGE_LOCAL_ROOT is /app/storage.
    # Without a disk, documents live on the container's ephemeral filesystem.
    # disk:
    #   name: koverly-storage
    #   mountPath: /app/storage
    #   sizeGB: 1

    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Set in the dashboard (service → Environment). Supabase "Session pooler"
      # URI — IPv4, so reachable from Render — e.g.:
      #   postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # The app upgrades plain postgres:// / postgresql:// to asyncpg itself.
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /app/storage
      # Deterministic offline provider: extracts and answers from your own data
      # without external calls and never fabricates values. Set AI_PROVIDER=openai
      # (plus AI_API_KEY / AI_BASE_URL / AI_MODEL) to enable an external model.
      - key: AI_PROVIDER
        value: null
      - key: NOTIFICATION_BACKEND
        value: noop
